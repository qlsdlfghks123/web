
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c7381fd36c22324294c57f0f9fc3495d&autoload=false"></script>

  <script>
    kakao.maps.load(function () {

      const mapContainer = document.getElementById('map');

      const mapOption = {
        center: new kakao.maps.LatLng(33.45, 126.57),
        level: 10
      };

      const map = new kakao.maps.Map(
        mapContainer,
        mapOption
      );

      window.addEventListener('resize', function () {
        map.relayout();
      });

    });
  </script>

</body>
</html>
